<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Caducidad</title>
	<link rel="stylesheet" href="estilos.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#317EFB">
</head>
<body>
    <main>
		<button id="btn-permiso" style="display: none; background: #ff9800; color: white; border: none; padding: 10px; cursor: pointer; width: 100%;">
		    🔔 Activar Notificaciones de Vencimiento
		</button>
		<h2 class="titulo-app">
			<img src="icono.svg" alt="Logo Control de Caducidad" class="logo-svg">
			<span>Control de Caducidades</span>
		</h2>
        <!-- Reemplaza tu bloque <form> por este -->
		<form id="form-producto">
			<!-- Botón principal que siempre estará visible -->
			<button type="button" id="btn-desplegar" class="btn-toggle">➕ Añadir Producto</button>
			
			<!-- Contenedor con los campos que se ocultarán/mostrarán -->
			<div id="campos-producto" class="form-campos oculto">
				<input type="text" id="nombre" placeholder="Nombre del producto" required>
				<input type="date" id="fecha" required>
				<button type="submit" class="btn-guardar">💾 Guardar en Lista</button>
			</div>
		</form>
        
		<input type="text" id="buscar-producto" placeholder="🔍 Buscar producto en la lista...">
		
        <h3>Lista de Productos</h3>
        <ul id="lista-productos"></ul>
    </main>

    <script src="app.js"></script>
</body>
</html>
